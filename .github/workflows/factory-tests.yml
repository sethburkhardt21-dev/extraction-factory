name: Factory tests

on:
  push:
    branches:
      - chatgpt-pipeline-optimization-20260901
  pull_request:
    paths:
      - 'factory/**'
      - '.github/workflows/factory-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: factory
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install runtime dependency
        run: python -m pip install --upgrade pip pypdf==5.9.0

      - name: Run governed factory tests
        run: python -m hermes_factory test
